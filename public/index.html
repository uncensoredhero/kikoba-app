<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kikoba</title><style>body{font-family:system-ui;max-width:900px;margin:30px auto;padding:0 16px;background:#f6f7fb}header{display:flex;justify-content:space-between}section{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 2px 12px #0001}input,select,button{padding:10px;margin:4px;border-radius:8px;border:1px solid #ddd}button{background:#222;color:#fff}#app{display:none}.row{display:flex;gap:10px;flex-wrap:wrap}.metric{font-size:2rem;font-weight:700}.goal{padding:10px;border-top:1px solid #eee}</style></head><body><header><h1>kikoba</h1><span>Save. Build. Grow.</span></header><section id="auth"><h2>Start</h2><input id="name" placeholder="Name"><input id="email" placeholder="Email"><button onclick="register()">Create account</button></section><main id="app"><section><h2 id="hello"></h2><div class="row"><div><small>Kikoba Score</small><div class="metric" id="score">—</div></div><div><small>Confidence</small><div class="metric" id="confidence">—</div></div><div><small>Profile</small><div id="profile">—</div></div></div></section><section><h2>New savings goal</h2><input id="goalName" placeholder="Emergency fund"><input id="target" type="number" placeholder="Target KSh"><input id="contribution" type="number" placeholder="Contribution KSh"><select id="frequency"><option>WEEKLY</option><option>MONTHLY</option></select><button onclick="goal()">Create goal</button></section><section><h2>Save money</h2><input id="amount" type="number" placeholder="Amount KSh"><select id="goalSelect"><option value="">Auto allocate</option></select><button onclick="deposit()">Deposit</button></section><section><h2>Your goals</h2><div id="goals"></div></section><section><h2>Friends & chat</h2><input id="friendId" placeholder="Friend user ID"><button onclick="friend()">Add friend</button><div id="friends"></div></section></main><script>const API='/v1';let user=JSON.parse(localStorage.getItem('kikobaUser')||'null');async function api(path,method='GET',body){const r=await fetch(API+path,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const x=await r.json();if(!r.ok)throw new Error(x.error||'Request failed');return x}async function register(){user=await api('/auth/register','POST',{name:name.value,email:email.value});localStorage.setItem('kikobaUser',JSON.stringify(user));show()}function show(){auth.style.display='none';app.style.display='block';hello.textContent='Hello, '+user.name;load()}async function load(){const d=await api('/users/'+user.id+'/dashboard');score.textContent=d.score.score+'/1000';confidence.textContent=Math.round(d.score.confidence*100)+'%';profile.textContent=d.score.profile;goals.innerHTML='';goalSelect.innerHTML='<option value="">Auto allocate</option>';d.goals.forEach(g=>{goals.innerHTML+='<div class="goal"><b>'+g.name+'</b> — KSh '+g.saved+' / '+g.targetAmount+' ('+Math.round(g.progress*100)+'%)</div>';goalSelect.innerHTML+='<option value="'+g.id+'">'+g.name+'</option>'});const f=await api('/users/'+user.id+'/friends');friends.innerHTML=f.map(x=>'<div>'+x.name+' <small>'+x.id+'</small></div>').join('')}async function goal(){await api('/goals','POST',{userId:user.id,name:goalName.value,targetAmount:+target.value,expectedAmount:+contribution.value,frequency:frequency.value});load()}async function deposit(){await api('/deposits','POST',{userId:user.id,amount:+amount.value,goalId:goalSelect.value||undefined});amount.value='';load()}async function friend(){await api('/friends','POST',{userId:user.id,friendId:friendId.value});load()}if(user)show()</script></body></html>
