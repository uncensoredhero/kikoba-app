<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kikoba</title>
<style>
:root{--bg:#F8F5EF;--surface:#fff;--surface2:#E8F5EE;--ink:#1A1A1A;--soft:#4A4A4A;--faint:#8A8A8A;--green:#0D4A2F;--green2:#1A6B45;--gold:#F5A623;--goldp:#FDF0D5;--border:#E8E4DE;--danger:#B4482F;--radius:10px;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh}.app{width:100%;max-width:440px;min-height:100vh;margin:auto;background:var(--surface);position:relative}@media(min-width:480px){body{padding:28px 16px}.app{min-height:820px;border-radius:20px;overflow:hidden;box-shadow:0 0 60px #0d4a2f1e}}.topbar{height:64px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:10px}.logo{width:30px;height:30px;border-radius:8px;background:var(--gold);display:grid;place-items:center;color:var(--green);font-weight:900}.wordmark{font-family:Georgia,serif;font-size:20px;font-weight:900;color:var(--green)}main{padding:22px 22px 92px}.page{display:none;animation:fade .25s ease}.page.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.eyebrow,.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:0 0 5px}.title{font-size:25px;margin:0 0 16px;font-weight:800}.section-title{font-weight:700;color:var(--soft);margin:23px 0 10px}.trust{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);background:var(--surface2);border-radius:var(--radius);padding:14px 16px;margin-bottom:22px;cursor:pointer}.trust-score{font-family:var(--mono);font-size:21px;font-weight:800}.trust small{color:var(--faint)}.tier{padding:5px 11px;background:#d7eddf;color:var(--green);border-radius:999px;font-size:11px;font-weight:800}.card{border:1.5px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:10px;background:var(--surface)}.goal-top{display:flex;justify-content:space-between;gap:10px}.goal-name{font-weight:800}.goal-meta{font:11px var(--mono);color:var(--faint);margin:6px 0 10px}.track{height:6px;background:var(--border);border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--gold);border-radius:999px}.empty{border:1.5px dashed var(--border);border-radius:var(--radius);padding:20px;text-align:center;color:var(--faint);font-size:13px}.cta{width:100%;border:0;border-radius:var(--radius);background:var(--green);color:white;padding:14px 18px;font-weight:800;font-size:14px;cursor:pointer}.cta:hover{background:var(--green2)}.cta.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}.metric-label{font-size:11px;color:var(--faint);margin-bottom:5px}.metric-value{font:700 19px var(--mono)}.field{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:var(--radius);font:14px system-ui;background:var(--surface2);color:var(--ink);outline:none}.field:focus{border-color:var(--green)}.form{display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:8px}.row .field{flex:1}.message{font-size:13px;color:var(--danger);margin-top:8px}.success{color:var(--green)}.friend{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--border)}.friend:last-child{border-bottom:0}.avatar{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.friend-info{flex:1}.friend-name{font-weight:700;font-size:14px}.friend-id{font:10px var(--mono);color:var(--faint);margin-top:2px}.add{padding:7px 12px;border-radius:999px;border:1.5px solid var(--green);background:transparent;color:var(--green);font-weight:800;cursor:pointer}.bottom{position:absolute;left:0;right:0;bottom:0;height:70px;background:var(--surface);border-top:1px solid var(--border);display:flex}.nav{flex:1;border:0;background:none;color:var(--faint);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.nav b{font-size:19px;line-height:17px}.nav.active{color:var(--green)}.modal-bg{position:fixed;inset:0;background:#1a1a1a77;display:none;align-items:flex-end;justify-content:center;z-index:5}.modal-bg.show{display:flex}.modal{width:min(440px,100%);background:white;border-radius:20px 20px 0 0;padding:22px 22px 30px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.close{border:0;border-radius:50%;width:32px;height:32px;background:var(--surface2);font-size:18px;cursor:pointer}.score-ring{width:150px;height:150px;border:10px solid var(--gold);border-left-color:var(--border);border-bottom-color:var(--border);border-radius:50%;display:grid;place-items:center;margin:10px auto 18px}.score-big{font:800 35px var(--mono)}.score-list{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}.score-line{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px}.score-line:last-child{border:0}.muted{color:var(--faint)}
</style>
</head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="logo">K</div><div class="wordmark">kikoba</div></div></header>
<section id="auth" style="padding:22px"><p class="eyebrow">Welcome</p><h1 class="title">Start saving together</h1><div class="card"><div class="form"><input id="name" class="field" placeholder="Name"><input id="email" class="field" type="email" placeholder="Email"><button id="registerButton" class="cta">Create account</button><div id="authMessage" class="message"></div></div></div></section>
<main id="appMain" style="display:none">
<section class="page active" id="home"><p class="eyebrow">Welcome back</p><h1 class="title" id="homeName">Kikoba member</h1><button class="trust" id="openScore"><span><span class="trust-score" id="scoreMini">—</span> <small>/ 1000</small></span><span class="tier" id="tierMini">Building</span></button><div class="grid"><div class="metric"><div class="metric-label">Confidence</div><div class="metric-value" id="confidence">—</div></div><div class="metric"><div class="metric-label">Active goals</div><div class="metric-value" id="goalCount">0</div></div></div><p class="section-title">Your savings goals</p><div id="homeGoals"></div><button class="cta" onclick="switchTab('savings')">Create a savings goal</button><button class="cta ghost" style="margin-top:8px" onclick="switchTab('friends')">Add friends to Kikoba</button></section>
<section class="page" id="savings"><p class="eyebrow">Save consistently</p><h1 class="title">Savings</h1><div class="card"><p class="section-title" style="margin-top:0">New goal</p><div class="form"><input id="goalName" class="field" placeholder="e.g. Emergency fund"><div class="row"><input id="target" class="field" type="number" placeholder="Target KSh" min="1"><input id="contribution" class="field" type="number" placeholder="Contribution KSh" min="1"></div><select id="frequency" class="field"><option>WEEKLY</option><option>MONTHLY</option></select><button class="cta" id="goalButton">Create goal</button></div></div><p class="section-title">Add money</p><div class="card"><div class="form"><input id="amount" class="field" type="number" placeholder="Amount KSh" min="1"><select id="goalSelect" class="field"><option value="">Auto allocate</option></select><button class="cta" id="depositButton">Deposit</button><div id="savingMessage" class="message"></div></div></div><p class="section-title">Your goals</p><div id="goals"></div></section>
<section class="page" id="friends"><p class="eyebrow">Your network</p><h1 class="title">Friends & chat</h1><div class="card"><div class="form"><input id="friendId" class="field" placeholder="Friend user ID"><button class="cta" id="friendButton">Add friend</button><div id="friendMessage" class="message"></div></div></div><p class="section-title">Your friends</p><div class="card" id="friends"></div></section>
<section class="page" id="profile"><h1 class="title">Profile</h1><div class="card" style="text-align:center"><div class="avatar" id="profileAvatar" style="width:64px;height:64px;margin:auto;font-size:25px">K</div><h3 id="profileName" style="margin:12px 0 2px"></h3><div class="muted" id="profileEmail"></div></div><button class="trust" id="openScore2"><span><span class="trust-score" id="scoreProfile">—</span> <small>/ 1000</small></span><span class="tier" id="tierProfile">Building</span></button></section>
</main>
<nav class="bottom" id="bottom" style="display:none"><button class="nav active" data-tab="home"><b>⌂</b>Home</button><button class="nav" data-tab="savings"><b>+</b>Save</button><button class="nav" data-tab="friends"><b>◎</b>Friends</button><button class="nav" data-tab="profile"><b>◉</b>Profile</button></nav></div>
<div class="modal-bg" id="scoreModal"><div class="modal"><div class="modal-head"><strong>Trust score</strong><button class="close" onclick="closeScore()">×</button></div><div class="score-ring"><div style="text-align:center"><div class="score-big" id="scoreBig">—</div><small>/ 1000</small></div></div><div class="score-list"><div class="score-line"><span>Consistency</span><b id="scoreConsistency">—</b></div><div class="score-line"><span>Confidence</span><b id="scoreConfidence">—</b></div><div class="score-line"><span>Profile</span><b id="scoreProfileText">—</b></div></div></div></div>
<script>
const API='/api/v1';let user=JSON.parse(localStorage.getItem('kikobaUser')||'null');let dashboard=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,method='GET',body){const r=await fetch(API+path,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const text=await r.text();let x={};try{x=text?JSON.parse(text):{}}catch{x={error:text||'Request failed'}}if(!r.ok)throw new Error(x.error||'Request failed');return x}function switchTab(tab){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===tab));document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));window.scrollTo(0,0)}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>switchTab(n.dataset.tab));function tier(score){return score>=750?'Established':score>=450?'Growing':'Building'}function render(){if(!dashboard)return;const s=dashboard.score||{};const score=s.score??0;const conf=Math.round((s.confidence??0)*100);$('homeName').textContent=user.name;$('scoreMini').textContent=score;$('confidence').textContent=conf+'%';$('goalCount').textContent=(dashboard.goals||[]).length;$('tierMini').textContent=tier(score);$('profileName').textContent=user.name;$('profileEmail').textContent=user.email||'';$('profileAvatar').textContent=user.name.charAt(0).toUpperCase();$('scoreProfile').textContent=score;$('tierProfile').textContent=tier(score);$('scoreBig').textContent=score;$('scoreConsistency').textContent=score+'/1000';$('scoreConfidence').textContent=conf+'%';$('scoreProfileText').textContent=s.profile||'Building';const gs=dashboard.goals||[];const html=gs.length?gs.map(g=>`<div class="card"><div class="goal-top"><div class="goal-name">${esc(g.name)}</div><b>KSh ${Number(g.saved||0).toLocaleString()}</b></div><div class="goal-meta">Target KSh ${Number(g.targetAmount||0).toLocaleString()} · ${Math.round((g.progress||0)*100)}%</div><div class="track"><div class="fill" style="width:${Math.min(100,(g.progress||0)*100)}%"></div></div></div>`).join(''):'<div class="empty">No savings goals yet. Create your first goal.</div>';$('goals').innerHTML=html;$('homeGoals').innerHTML=html;$('goalSelect').innerHTML='<option value="">Auto allocate</option>'+gs.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}async function load(){dashboard=await api('/users/'+encodeURIComponent(user.id)+'/dashboard');render();const fs=await api('/users/'+encodeURIComponent(user.id)+'/friends');$('friends').innerHTML=fs.length?fs.map(f=>`<div class="friend"><div class="avatar">${esc(f.name.charAt(0).toUpperCase())}</div><div class="friend-info"><div class="friend-name">${esc(f.name)}</div><div class="friend-id">${esc(f.id)}</div></div></div>`).join(''):'<div class="empty">Add friends and build your Kikoba network.</div>'}function show(){if(!user)return;$('auth').style.display='none';$('appMain').style.display='block';$('bottom').style.display='flex';load().catch(e=>console.error(e))}$('registerButton').onclick=async()=>{const m=$('authMessage');m.textContent='';const name=$('name').value.trim(),email=$('email').value.trim();if(name.length<2||!email){m.textContent='Enter your name and email.';return}try{user=await api('/auth/register','POST',{name,email});localStorage.setItem('kikobaUser',JSON.stringify(user));show()}catch(e){m.textContent=e.message==='EMAIL_EXISTS'?'An account with this email already exists.':e.message}};$('goalButton').onclick=async()=>{try{await api('/goals','POST',{userId:user.id,name:$('goalName').value.trim(),targetAmount:+$('target').value,expectedAmount:+$('contribution').value,frequency:$('frequency').value});$('goalName').value=$('target').value=$('contribution').value='';await load()}catch(e){$('savingMessage').textContent=e.message}};$('depositButton').onclick=async()=>{try{await api('/deposits','POST',{userId:user.id,amount:+$('amount').value,goalId:$('goalSelect').value||undefined});$('amount').value='';$('savingMessage').textContent='Deposit recorded.';$('savingMessage').className='message success';await load()}catch(e){$('savingMessage').textContent=e.message}};$('friendButton').onclick=async()=>{try{await api('/friends','POST',{userId:user.id,friendId:$('friendId').value.trim()});$('friendId').value='';$('friendMessage').textContent='Friend added.';$('friendMessage').className='message success';await load()}catch(e){$('friendMessage').textContent=e.message}};function openScore(){$('scoreModal').classList.add('show')}function closeScore(){$('scoreModal').classList.remove('show')}$('openScore').onclick=openScore;$('openScore2').onclick=openScore;if(user)show();
</script></body></html>
