<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kikoba</title>
<style>
body{font-family:system-ui;max-width:900px;margin:30px auto;padding:0 16px;background:#f6f7fb;color:#172033}header{display:flex;justify-content:space-between;align-items:center}section{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 2px 12px #0001}input,select,button{padding:10px;margin:4px;border-radius:8px;border:1px solid #ddd}button{background:#222;color:#fff;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#app{display:none}.row{display:flex;gap:10px;flex-wrap:wrap}.metric{font-size:2rem;font-weight:700}.goal{padding:10px;border-top:1px solid #eee}.error{color:#b42318;margin:8px 4px}.success{color:#067647;margin:8px 4px}
</style>
</head>
<body>
<header><h1>kikoba</h1><span>Save. Build. Grow.</span></header>
<section id="auth"><h2>Start</h2><input id="name" placeholder="Name" autocomplete="name"><input id="email" type="email" placeholder="Email" autocomplete="email"><button id="registerButton" type="button" onclick="register()">Create account</button><div id="authMessage" class="error"></div></section>
<main id="app">
<section><h2 id="hello"></h2><div class="row"><div><small>Kikoba Score</small><div class="metric" id="score">—</div></div><div><small>Confidence</small><div class="metric" id="confidence">—</div></div><div><small>Profile</small><div id="profile">—</div></div></div></section>
<section><h2>New savings goal</h2><input id="goalName" placeholder="Emergency fund"><input id="target" type="number" placeholder="Target KSh" min="1"><input id="contribution" type="number" placeholder="Contribution KSh" min="1"><select id="frequency"><option>WEEKLY</option><option>MONTHLY</option></select><button type="button" onclick="goal()">Create goal</button></section>
<section><h2>Save money</h2><input id="amount" type="number" placeholder="Amount KSh" min="1"><select id="goalSelect"><option value="">Auto allocate</option></select><button type="button" onclick="deposit()">Deposit</button></section>
<section><h2>Your goals</h2><div id="goals"></div></section>
<section><h2>Friends & chat</h2><input id="friendId" placeholder="Friend user ID"><button type="button" onclick="friend()">Add friend</button><div id="friends"></div></section>
</main>
<script>
const API='/v1';
let user=JSON.parse(localStorage.getItem('kikobaUser')||'null');
const $=id=>document.getElementById(id);
async function api(path,method='GET',body){
  const r=await fetch(API+path,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const text=await r.text();
  let x={}; try{x=text?JSON.parse(text):{}}catch{x={error:text||'Request failed'}}
  if(!r.ok)throw new Error(x.error||'Request failed');
  return x;
}
async function register(){
  const message=$('authMessage');
  const button=$('registerButton');
  message.textContent='';
  const userName=$('name').value.trim();
  const userEmail=$('email').value.trim();
  if(userName.length<2){message.textContent='Please enter a name with at least 2 characters.';return}
  if(!userEmail){message.textContent='Please enter your email.';return}
  button.disabled=true;button.textContent='Creating account...';
  try{
    user=await api('/auth/register','POST',{name:userName,email:userEmail});
    localStorage.setItem('kikobaUser',JSON.stringify(user));
    show();
  }catch(error){message.textContent=error.message==='EMAIL_EXISTS'?'An account with this email already exists.':'Could not create your account: '+error.message}
  finally{button.disabled=false;button.textContent='Create account'}
}
function show(){
  $('auth').style.display='none';$('app').style.display='block';$('hello').textContent='Hello, '+user.name;load().catch(error=>console.error(error));
}
async function load(){
  const d=await api('/users/'+encodeURIComponent(user.id)+'/dashboard');
  $('score').textContent=d.score.score+'/1000';$('confidence').textContent=Math.round(d.score.confidence*100)+'%';$('profile').textContent=d.score.profile;
  $('goals').innerHTML='';$('goalSelect').innerHTML='<option value="">Auto allocate</option>';
  d.goals.forEach(g=>{$('goals').innerHTML+='<div class="goal"><b>'+escapeHtml(g.name)+'</b> — KSh '+g.saved+' / '+g.targetAmount+' ('+Math.round(g.progress*100)+'%)</div>';$('goalSelect').innerHTML+='<option value="'+g.id+'">'+escapeHtml(g.name)+'</option>'});
  const f=await api('/users/'+encodeURIComponent(user.id)+'/friends');$('friends').innerHTML=f.map(x=>'<div>'+escapeHtml(x.name)+' <small>'+x.id+'</small></div>').join('');
}
async function goal(){try{await api('/goals','POST',{userId:user.id,name:$('goalName').value.trim(),targetAmount:+$('target').value,expectedAmount:+$('contribution').value,frequency:$('frequency').value});await load()}catch(error){alert(error.message)}}
async function deposit(){try{await api('/deposits','POST',{userId:user.id,amount:+$('amount').value,goalId:$('goalSelect').value||undefined});$('amount').value='';await load()}catch(error){alert(error.message)}}
async function friend(){try{await api('/friends','POST',{userId:user.id,friendId:$('friendId').value.trim()});await load()}catch(error){alert(error.message)}}
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
if(user)show();
</script>
</body>
</html>
